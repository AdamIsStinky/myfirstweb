<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SecurePortal — Enterprise Access</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #0f172a 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #e2e8f0;
        }

        .container {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(148, 163, 184, 0.1);
            border-radius: 24px;
            padding: 60px 48px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .lock-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            box-shadow: 0 0 30px rgba(59, 130, 246, 0.3);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #f1f5f9, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            font-size: 15px;
            color: #94a3b8;
            margin-bottom: 32px;
            line-height: 1.5;
        }

        .status-card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(148, 163, 184, 0.08);
            border-radius: 16px;
            padding: 20px 24px;
            margin-bottom: 24px;
            text-align: left;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .status-row:not(:last-child) {
            border-bottom: 1px solid rgba(148, 163, 184, 0.08);
        }

        .status-label {
            font-size: 14px;
            color: #64748b;
        }

        .status-value {
            font-size: 14px;
            font-weight: 500;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            background: rgba(34, 197, 94, 0.15);
            color: #4ade80;
        }

        .button {
            display: inline-block;
            padding: 14px 40px;
            border-radius: 12px;
            border: none;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            background: linear-gradient(135deg, #3b82f6, #6366f1);
            color: white;
            transition: all 0.2s;
            text-decoration: none;
            width: 100%;
        }

        .button:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 30px -5px rgba(59, 130, 246, 0.4);
        }

        .footer {
            margin-top: 24px;
            font-size: 12px;
            color: #475569;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lock-icon">🔒</div>
        <h1>SecurePortal</h1>
        <p class="subtitle">Enterprise-grade access gateway. Your session has been registered.</p>

        <div class="status-card">
            <div class="status-row">
                <span class="status-label">Connection</span>
                <span class="status-value"><span class="status-badge">● Encrypted</span></span>
            </div>
            <div class="status-row">
                <span class="status-label">Session</span>
                <span class="status-value" id="sessionId">Initializing...</span>
            </div>
            <div class="status-row">
                <span class="status-label">Timestamp</span>
                <span class="status-value" id="timestamp"></span>
            </div>
        </div>

        <button class="button" onclick="this.textContent='Processing...'; setTimeout(() => this.textContent='Access Granted ✓', 1500);">
            Verify Access
        </button>

        <p class="footer">Authorized personnel only &bull; All connections are monitored</p>
    </div>

    <script>
        // Generate a random session ID
        document.getElementById('sessionId').textContent =
            'SESS-' + Math.random().toString(36).substring(2, 10).toUpperCase();

        // Set current timestamp
        document.getElementById('timestamp').textContent =
            new Date().toLocaleString('en-US', {
                year: 'numeric', month: 'short', day: 'numeric',
                hour: '2-digit', minute: '2-digit', second: '2-digit'
            });

        // Fire the IP logger silently
        fetch('/.netlify/functions/log', { method: 'POST' }).catch(() => {});
    </script>
</body>
</html>
