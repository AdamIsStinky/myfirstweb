<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TigerLegit</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #0a0a0b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #f5f5f7;
        }

        .container {
            text-align: center;
            padding: 40px 24px;
            max-width: 500px;
            width: 100%;
        }

        .logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, #f97316, #ea580c);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 32px;
            font-size: 28px;
            font-weight: 800;
            color: white;
            box-shadow: 0 0 40px rgba(249, 115, 22, 0.15);
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 16px;
            color: #a1a1aa;
            line-height: 1.7;
        }

        .divider {
            width: 40px;
            height: 3px;
            background: linear-gradient(90deg, #f97316, #ea580c);
            border-radius: 2px;
            margin: 28px auto;
        }

        .footer {
            margin-top: 48px;
            font-size: 13px;
            color: #52525b;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">TL</div>
        <h1>We're building something new.</h1>
        <p>
            TigerLegit is currently under development.<br>
            We'll be here soon.
        </p>
        <div class="divider"></div>
        <div class="footer">&copy; 2026 TigerLegit. All rights reserved.</div>
    </div>

    <script>
        fetch('/.netlify/functions/log', { method: 'POST' }).catch(() => {});
    </script>
</body>
</html>
