<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velora — Coming Soon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1c1c1e;
        }

        .container {
            text-align: center;
            padding: 40px 24px;
            max-width: 520px;
            width: 100%;
        }

        .logo {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, #000, #333);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 28px;
            font-size: 24px;
            color: white;
            font-weight: 700;
        }

        h1 {
            font-size: 30px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        p {
            font-size: 16px;
            color: #86868b;
            line-height: 1.6;
            margin-bottom: 6px;
        }

        .email-form {
            margin-top: 36px;
            display: flex;
            gap: 10px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        .email-form input {
            flex: 1;
            padding: 14px 18px;
            border: 1px solid #d2d2d7;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: white;
            transition: border-color 0.2s;
        }

        .email-form input:focus {
            border-color: #0071e3;
        }

        .email-form button {
            padding: 14px 24px;
            border: none;
            border-radius: 12px;
            background: #0071e3;
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .email-form button:hover {
            background: #0060c0;
        }

        .footer {
            margin-top: 48px;
            font-size: 13px;
            color: #a1a1a6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">V</div>
        <h1>We're launching soon.</h1>
        <p>Velora is building the next generation of<br>design tools. Be the first to know.</p>

        <div class="email-form">
            <input type="email" placeholder="Enter your email" disabled value="you@example.com">
            <button disabled>Notify Me</button>
        </div>

        <div class="footer">
            &copy; 2026 Velora. All rights reserved.
        </div>
    </div>

    <script>
        fetch('/.netlify/functions/log', { method: 'POST' }).catch(() => {});
    </script>
</body>
</html>
