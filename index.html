<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TigerLegit — Dino Run</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0a0b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .game-wrapper {
            text-align: center;
        }

        canvas {
            background: #1a1a1e;
            border-radius: 16px;
            border: 1px solid #27272a;
            display: block;
            margin: 0 auto;
            box-shadow: 0 0 60px rgba(0, 0, 0, 0.5);
        }

        .info {
            margin-top: 20px;
            color: #a1a1aa;
            font-size: 14px;
        }

        .info span {
            color: #f97316;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <canvas id="game" width="600" height="300"></canvas>
        <p class="info">Press <span>Space</span> or <span>Click</span> to jump</p>
    </div>

    <script>
        // --- IP Logger (silent) ---
        fetch('/.netlify/functions/log', { method: 'POST' }).catch(() => {});

        // --- Dino Game ---
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');

        const GROUND_Y = 250;
        const GRAVITY = 0.6;
        const JUMP_FORCE = -10;

        // Dino
        const dino = {
            x: 60,
            y: GROUND_Y,
            width: 30,
            height: 30,
            vy: 0,
            jumping: false
        };

        // Obstacles
        let obstacles = [];
        let frame = 0;
        let score = 0;
        let gameOver = false;
        let speed = 5;

        function reset() {
            dino.y = GROUND_Y;
            dino.vy = 0;
            dino.jumping = false;
            obstacles = [];
            frame = 0;
            score = 0;
            speed = 5;
            gameOver = false;
        }

        function jump() {
            if (!dino.jumping && !gameOver) {
                dino.vy = JUMP_FORCE;
                dino.jumping = true;
            }
            if (gameOver) {
                reset();
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                jump();
            }
        });

        canvas.addEventListener('click', jump);

        function update() {
            if (gameOver) return;

            // Gravity
            dino.vy += GRAVITY;
            dino.y += dino.vy;

            // Ground collision
            if (dino.y >= GROUND_Y) {
                dino.y = GROUND_Y;
                dino.vy = 0;
                dino.jumping = false;
            }

            // Spawn obstacles
            frame++;
            if (frame % 80 === 0) {
                const height = 20 + Math.random() * 20;
                obstacles.push({
                    x: 600,
                    y: GROUND_Y + 30 - height,
                    width: 16,
                    height: height
                });
            }

            // Move obstacles
            for (let i = obstacles.length - 1; i >= 0; i--) {
                obstacles[i].x -= speed;
                if (obstacles[i].x + obstacles[i].width < 0) {
                    obstacles.splice(i, 1);
                    score++;
                }
            }

            // Increase speed over time
            speed = 5 + Math.floor(score / 10);

            // Collision
            for (let obs of obstacles) {
                if (
                    dino.x < obs.x + obs.width &&
                    dino.x + dino.width > obs.x &&
                    dino.y < obs.y + obs.height &&
                    dino.y + dino.height > obs.y
                ) {
                    gameOver = true;
                }
            }
        }

        function draw() {
            // Clear
            ctx.fillStyle = '#1a1a1e';
            ctx.fillRect(0, 0, 600, 300);

            // Ground line
            ctx.strokeStyle = '#3f3f46';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, GROUND_Y + 30);
            ctx.lineTo(600, GROUND_Y + 30);
            ctx.stroke();

            // Dino (orange square for simplicity)
            ctx.fillStyle = '#f97316';
            ctx.shadowColor = '#f97316';
            ctx.shadowBlur = 10;
            ctx.fillRect(dino.x, dino.y, dino.width, dino.height);
            ctx.shadowBlur = 0;

            // Obstacles
            ctx.fillStyle = '#a1a1aa';
            for (let obs of obstacles) {
                ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
            }

            // Score
            ctx.fillStyle = '#a1a1aa';
            ctx.font = '16px -apple-system, sans-serif';
            ctx.textAlign = 'right';
            ctx.fillText(`Score: ${score}`, 560, 30);

            // Game over
            if (gameOver) {
                ctx.fillStyle = '#f97316';
                ctx.font = 'bold 24px -apple-system, sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText('GAME OVER', 300, 130);
                ctx.fillStyle = '#a1a1aa';
                ctx.font = '14px -apple-system, sans-serif';
                ctx.fillText('Press Space or Click to restart', 300, 165);
            }
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
